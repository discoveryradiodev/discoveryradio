<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-label="Halftone texture overlay">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#0f172a" fill-opacity="0.38"/>
      <circle cx="12" cy="10" r="1.8" fill="#0f172a" fill-opacity="0.28"/>
      <circle cx="6" cy="14" r="1.2" fill="#0f172a" fill-opacity="0.22"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="360" height="260" fill="url(#dots)"/>
  <rect width="360" height="260" fill="url(#fade)"/>
</svg>
