<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-label="Tape strip overlay">
  <defs>
    <linearGradient id="tapeShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3b0" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0.56"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.13"/>
