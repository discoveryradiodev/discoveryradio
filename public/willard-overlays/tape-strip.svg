    </filter>
  </defs>
  <rect x="10" y="12" width="300" height="72" rx="8" fill="url(#tapeShade)" stroke="#f59e0b" stroke-opacity="0.5"/>
  <rect x="10" y="12" width="300" height="72" rx="8" fill="#000" filter="url(#grain)"/>
  <path d="M18 46h284" stroke="#fef3c7" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="4 6"/>
